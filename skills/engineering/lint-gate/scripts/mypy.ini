# The type gate of these scripts: the Python target of the skill they belong to.
[mypy]
python_version = 3.11
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_unimported = true
# noise: `explicit-override` needs `typing.override`, which is Python 3.12; these scripts
# run on 3.11 with the standard library alone, so the code stays out of the list below.
enable_error_code = ignore-without-code, redundant-expr, truthy-bool, truthy-iterable, possibly-undefined, unused-awaitable, mutable-override, deprecated, redundant-self
